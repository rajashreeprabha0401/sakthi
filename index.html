<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>For Sakthi ✨</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@600;800&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --gold1:#fff1b8; --gold2:#ffd166; --gold3:#f0a830;
    --pink:#ff5fa2; --violet:#a56bff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:'Poppins',sans-serif;color:#fff;
    background:radial-gradient(ellipse at 50% 120%,#7b2d8e 0%,#3a1561 40%,#140a2b 100%);
    transition:background 1.2s ease;
  }
  body.lights-off{background:radial-gradient(ellipse at 50% 100%,#1f0e3a 0%,#0a0516 70%)}
  body.party{background:radial-gradient(ellipse at 50% 110%,#a8328f 0%,#4a1a78 45%,#190c35 100%)}

  #stars{position:fixed;inset:0;z-index:0;pointer-events:none}
  .star{position:absolute;background:#fff;border-radius:50%;animation:twinkle 3s ease-in-out infinite}
  @keyframes twinkle{0%,100%{opacity:.15;transform:scale(.7)}50%{opacity:1;transform:scale(1.2)}}
  .shoot{position:absolute;width:140px;height:2px;background:linear-gradient(90deg,transparent,#fff);
    transform:rotate(25deg);opacity:0;animation:shoot 1.2s ease-out forwards}
  @keyframes shoot{0%{opacity:1;transform:translate(0,0) rotate(25deg)}100%{opacity:0;transform:translate(320px,150px) rotate(25deg)}}

  canvas#fx{position:fixed;inset:0;z-index:60;pointer-events:none}
  #flash{position:fixed;inset:0;z-index:70;pointer-events:none;opacity:0;
    background:radial-gradient(circle,#fff 0%,rgba(255,240,200,.8) 40%,transparent 75%)}
  #flash.go{animation:flash 1.1s ease-out}
  @keyframes flash{0%{opacity:0}25%{opacity:1}100%{opacity:0}}

  .scene{
    position:absolute;inset:0;z-index:2;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:20px;
    opacity:0;pointer-events:none;transform:scale(.94);
    transition:opacity .9s ease,transform .9s ease;
  }
  .scene.active{opacity:1;pointer-events:auto;transform:scale(1)}

  .gold-text{
    background:linear-gradient(100deg,var(--gold3),var(--gold1) 25%,var(--gold2) 50%,var(--gold1) 75%,var(--gold3));
    background-size:250% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    animation:shimmer 4s linear infinite;
  }
  @keyframes shimmer{to{background-position:-250% 0}}
  @keyframes fadeInFull{to{opacity:1}}
  @keyframes fadeIn{to{opacity:.85}}

  .btn{
    position:relative;overflow:hidden;margin-top:34px;border:none;cursor:pointer;
    padding:15px 42px;font-size:18px;font-weight:600;font-family:inherit;letter-spacing:.5px;
    color:#3a1561;border-radius:50px;
    background:linear-gradient(135deg,var(--gold1),var(--gold2) 50%,var(--gold3));
    box-shadow:0 10px 30px rgba(240,168,48,.45);
    animation:ring 2s infinite;transition:transform .2s;
  }
  .btn::after{content:"";position:absolute;top:0;left:-80%;width:50%;height:100%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.7),transparent);
    transform:skewX(-20deg);animation:sweep 2.8s infinite}
  @keyframes sweep{0%{left:-80%}60%,100%{left:140%}}
  @keyframes ring{0%{box-shadow:0 0 0 0 rgba(255,209,102,.55),0 10px 30px rgba(240,168,48,.45)}
    70%{box-shadow:0 0 0 22px rgba(255,209,102,0),0 10px 30px rgba(240,168,48,.45)}
    100%{box-shadow:0 0 0 0 rgba(255,209,102,0),0 10px 30px rgba(240,168,48,.45)}}
  .btn:hover{transform:scale(1.07)}
  .btn:active{transform:scale(.95)}

  /* ============ Scene 1: envelope ============ */
  #scene1 h1{font-family:'Great Vibes',cursive;font-weight:400;
    font-size:clamp(46px,12vw,88px);line-height:1.05;margin-top:46px;
    filter:drop-shadow(0 4px 18px rgba(255,209,102,.35))}
  #scene1 .sub{margin-top:14px;font-weight:300;letter-spacing:1px;font-size:15px;opacity:.8;max-width:300px;line-height:1.6}

  .env-stage{position:relative;width:min(300px,76vw);height:200px;animation:float 3.4s ease-in-out infinite}
  @keyframes float{50%{transform:translateY(-16px)}}
  .env-glow{position:absolute;left:50%;top:50%;width:420px;height:420px;transform:translate(-50%,-50%);
    background:radial-gradient(circle,rgba(255,209,102,.5),rgba(255,95,162,.18) 45%,transparent 70%);
    animation:glowpulse 2.6s ease-in-out infinite;z-index:0}
  @keyframes glowpulse{50%{transform:translate(-50%,-50%) scale(1.15);opacity:.7}}
  .env{position:absolute;inset:0;z-index:1;filter:drop-shadow(0 18px 28px rgba(0,0,0,.45))}
  .env-back{position:absolute;inset:0;border-radius:10px;background:linear-gradient(160deg,#f2c26b,#d98f2b)}
  .letter{position:absolute;left:8%;width:84%;top:6%;height:84%;border-radius:8px;
    background:linear-gradient(#fffdf6,#fbeccd);box-shadow:0 2px 8px rgba(0,0,0,.2);
    display:flex;align-items:center;justify-content:center;
    font-family:'Great Vibes',cursive;font-size:36px;color:#b0642a;transition:transform 1s .5s ease}
  .env-front{position:absolute;inset:0;border-radius:10px;background:#ebb04a;
    clip-path:polygon(0 0,50% 55%,100% 0,100% 100%,0 100%)}
  .env-flap{position:absolute;top:0;left:0;width:100%;height:58%;
    clip-path:polygon(0 0,100% 0,50% 100%);background:linear-gradient(#ffd98a,#e7a640);
    transform-origin:top;transition:transform .8s ease;z-index:3}
  .seal{position:absolute;left:50%;top:50%;width:54px;height:54px;transform:translate(-50%,-50%);z-index:4;
    border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff7aa8,#c2185b 70%);
    box-shadow:0 4px 10px rgba(0,0,0,.4),inset 0 0 0 4px rgba(255,255,255,.18);
    display:flex;align-items:center;justify-content:center;font-size:24px;color:#ffe9b3;
    transition:opacity .4s,transform .6s}
  #scene1.opening .seal{opacity:0;transform:translate(-50%,-50%) scale(1.8)}
  #scene1.opening .env-flap{transform:rotateX(180deg);z-index:0}
  #scene1.opening .letter{transform:translateY(-120px) scale(1.12)}
  #scene1.opening .env-stage{animation:none}
  .sparkle{position:absolute;pointer-events:none;color:var(--gold1);animation:sp 2.4s ease-in-out infinite;opacity:0;z-index:2}
  @keyframes sp{0%,100%{opacity:0;transform:scale(0) rotate(0)}50%{opacity:1;transform:scale(1) rotate(90deg)}}

  /* ============ Scene 2: story ============ */
  #storyText{font-weight:300;font-size:clamp(20px,5vw,30px);line-height:1.6;max-width:480px;letter-spacing:.4px;
    opacity:0;transform:translateY(16px);transition:opacity .9s ease,transform .9s ease}
  #storyText.in{opacity:1;transform:translateY(0)}
  #storyText.big{font-family:'Great Vibes',cursive;font-weight:400;font-size:clamp(70px,22vw,150px);line-height:1.1;
    background:linear-gradient(100deg,var(--gold3),var(--gold1) 30%,var(--gold2) 55%,var(--gold1) 80%,var(--gold3));
    background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
    animation:shimmer 3s linear infinite;filter:drop-shadow(0 0 22px rgba(255,209,102,.6))}

  /* ============ Scene 3: cake ============ */
  #scene3 h2{font-family:'Great Vibes',cursive;font-weight:400;font-size:clamp(40px,10vw,66px);margin-bottom:34px;
    filter:drop-shadow(0 3px 14px rgba(255,209,102,.4))}
  .bunting{position:fixed;top:0;left:0;width:100%;height:80px;display:flex;justify-content:space-around;pointer-events:none;z-index:1}
  .flag{width:34px;height:46px;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;animation:swing 2.4s ease-in-out infinite alternate}
  @keyframes swing{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}

  .cake-wrap{position:relative;width:min(320px,80vw);height:310px}
  .halo{position:absolute;left:50%;bottom:150px;width:420px;height:420px;transform:translateX(-50%);
    background:radial-gradient(circle,rgba(255,190,80,.38),transparent 65%);transition:opacity 1.2s;pointer-events:none;
    animation:halo 1.4s ease-in-out infinite alternate}
  @keyframes halo{from{transform:translateX(-50%) scale(.95)}to{transform:translateX(-50%) scale(1.06)}}
  .out-all .halo{opacity:0}
  .plate{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:128%;height:18px;
    background:linear-gradient(#fff,#d7c9e8);border-radius:50%;box-shadow:0 10px 20px rgba(0,0,0,.4)}
  .layer{position:absolute;left:50%;border-radius:16px;opacity:0;transform:translate(-50%,-320px);
    box-shadow:inset 0 -8px 14px rgba(0,0,0,.12)}
  #scene3.active .layer{animation:drop .9s var(--d,0s) cubic-bezier(.3,1.5,.5,1) forwards}
  .l1{--d:.3s;width:100%;height:84px;bottom:12px;
    background:radial-gradient(circle,#fff 1.5px,transparent 2px) 0 0/22px 22px,linear-gradient(#ff8fbf,#e8458a)}
  .l2{--d:.8s;width:76%;height:72px;bottom:92px;
    background:radial-gradient(circle,#ffd166 1.6px,transparent 2px) 6px 6px/20px 20px,linear-gradient(#fff6fb,#ffd3e6)}
  .l3{--d:1.3s;width:52%;height:62px;bottom:160px;
    background:radial-gradient(circle,#fff 1.4px,transparent 2px) 3px 3px/18px 18px,linear-gradient(#c79bff,#8e55f0)}
  @keyframes drop{to{opacity:1;transform:translate(-50%,0)}}
  .drip{position:absolute;top:0;left:0;width:100%;height:24px;border-radius:16px 16px 0 0;
    background:radial-gradient(circle at 11px 24px,#fff 11px,transparent 12px) 0 0/30px 24px repeat-x}
  .l1 .drip{background:radial-gradient(circle at 11px 24px,#fff0f7 11px,transparent 12px) 0 0/30px 24px repeat-x}
  .l2 .drip{background:radial-gradient(circle at 11px 24px,#ff8fbf 11px,transparent 12px) 0 0/30px 24px repeat-x}
  .name{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding-top:14px;
    font-family:'Great Vibes',cursive;font-size:38px;color:#fff;text-shadow:0 2px 6px rgba(150,20,80,.55)}
  .berry{position:absolute;top:-9px;width:18px;height:18px;border-radius:50% 50% 55% 55%;
    background:radial-gradient(circle at 30% 30%,#ff8a8a,#d4163c 70%);box-shadow:0 2px 4px rgba(0,0,0,.3);z-index:2}
  .berry::before{content:"";position:absolute;top:-4px;left:5px;width:8px;height:6px;background:#3dbb5e;border-radius:50% 50% 0 0}

  .candles{position:absolute;bottom:222px;left:50%;transform:translateX(-50%);display:flex;gap:13px;z-index:4}
  .candle{position:relative;width:9px;height:44px;border-radius:3px;
    background:repeating-linear-gradient(45deg,#fff 0 5px,#ff9ec8 5px 10px);
    opacity:0;transform:translateY(-70px)}
  #scene3.active .candle{animation:candleIn .6s var(--d) forwards}
  .candle:nth-child(1){--d:1.8s}.candle:nth-child(2){--d:1.95s}.candle:nth-child(3){--d:2.1s}
  .candle:nth-child(4){--d:2.25s}.candle:nth-child(5){--d:2.4s}
  @keyframes candleIn{to{opacity:1;transform:translateY(0)}}
  .flame{position:absolute;top:-25px;left:50%;width:14px;height:25px;transform:translateX(-50%);
    background:radial-gradient(ellipse at 50% 72%,#fff7b0 0,#ffc93c 45%,#ff7a18 80%);
    border-radius:50% 50% 50% 50%/62% 62% 38% 38%;
    box-shadow:0 0 22px 8px rgba(255,190,60,.75);
    transform-origin:50% 100%;animation:flicker .16s infinite alternate;transition:opacity .4s}
  @keyframes flicker{from{transform:translateX(-50%) scale(1,1) rotate(-3deg)}to{transform:translateX(-50%) scale(.88,1.14) rotate(3deg)}}
  .blowing .flame{animation:sway .13s infinite alternate !important}
  @keyframes sway{from{transform:translateX(-50%) rotate(-28deg) scale(.8)}to{transform:translateX(-50%) rotate(28deg) scale(.65)}}
  .candle.out .flame{animation:none;opacity:0;transform:translateX(-50%) scale(.2)}
  .smoke{position:absolute;top:-22px;left:50%;width:8px;height:8px;border-radius:50%;background:rgba(210,210,230,.6);opacity:0;filter:blur(2px)}
  .candle.out .smoke{animation:smoke 1.8s ease-out forwards}
  @keyframes smoke{0%{opacity:.85;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-10%,-90px) scale(4.5)}}
  .wind{position:absolute;left:-30px;top:-10px;font-size:44px;opacity:0;pointer-events:none;z-index:5}
  .blowing .wind{animation:windy 1s ease-out}
  @keyframes windy{0%{opacity:0;transform:translateX(-60px)}30%{opacity:1}100%{opacity:0;transform:translateX(200px)}}

  #blowBtn{opacity:0}
  #scene3.active #blowBtn{animation:fadeInFull .6s 2.9s forwards,ring 2s 2.9s infinite}
  .hint{margin-top:14px;font-size:14px;font-weight:300;opacity:0}
  #scene3.active .hint{animation:fadeIn 1s 3.1s forwards}

  /* ============ Scene 4: hero ============ */
  .hb,.nm{line-height:1}
  .hb{font-family:'Great Vibes',cursive;font-size:clamp(46px,12vw,88px);filter:drop-shadow(0 4px 20px rgba(255,209,102,.5))}
  .nm{font-family:'Great Vibes',cursive;font-size:clamp(54px,14vw,100px);filter:drop-shadow(0 4px 20px rgba(255,95,162,.55))}
  .hb span,.nm span{display:inline-block;opacity:0;transform:translateY(40px) scale(.4) rotate(-10deg);
    animation:letter .7s forwards;
    background:linear-gradient(180deg,var(--gold1),var(--gold2) 55%,var(--gold3));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .hb span.emo,.nm span.emo{background:none;color:#fff;-webkit-text-fill-color:initial}
  @keyframes letter{to{opacity:1;transform:translateY(0) scale(1) rotate(0)}}
  .badge{position:relative;width:min(44vw,210px);height:min(44vw,210px);margin:12px 0 6px;
    display:flex;align-items:center;justify-content:center;transform:scale(0)}
  #scene4.active .badge{animation:zoom 1s .9s cubic-bezier(.3,1.7,.5,1) forwards}
  @keyframes zoom{from{transform:scale(0) rotate(-30deg)}to{transform:scale(1) rotate(0)}}
  .badge::before{content:"";position:absolute;inset:0;border-radius:50%;
    background:conic-gradient(from 0deg,var(--gold3),var(--pink),var(--violet),#4cc9f0,var(--gold2),var(--gold3));
    animation:spin 5s linear infinite;filter:blur(1px)}
  .badge::after{content:"";position:absolute;inset:8px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#4a1a78,#1a0b36)}
  @keyframes spin{to{transform:rotate(360deg)}}
  .badge b{position:relative;z-index:2;font-family:'Playfair Display',serif;font-weight:800;
    font-size:min(24vw,118px);line-height:1;filter:drop-shadow(0 0 14px rgba(255,209,102,.7))}
  .tap{margin-top:18px;font-size:13px;font-weight:300;letter-spacing:1px;opacity:0}
  #scene4.active .tap{animation:fadeIn 1s 3s forwards}

  /* ============ Scene 5: letter ============ */
  .paper{width:min(92vw,520px);padding:26px 24px 22px;border-radius:22px;text-align:left;
    background:rgba(255,255,255,.12);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.3);box-shadow:0 14px 40px rgba(0,0,0,.35)}
  .paper h3{font-family:'Great Vibes',cursive;font-weight:400;font-size:clamp(40px,10vw,56px);text-align:center;margin-bottom:12px;line-height:1.1}
  .paper p{font-weight:300;font-size:clamp(14.5px,3.9vw,17px);line-height:1.75;margin-bottom:11px;min-height:1px}
  .caret{display:inline-block;width:2px;height:1em;background:var(--gold2);margin-left:2px;vertical-align:-2px;animation:blink .8s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .sign{text-align:right;font-family:'Great Vibes',cursive;font-size:34px;opacity:0;transition:opacity 1.2s}
  .sign.in{opacity:1}

  /* balloons / hearts */
  #balloons{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
  .balloon{position:absolute;bottom:-160px;width:54px;height:68px;border-radius:50% 50% 48% 48%;
    animation:bup linear forwards;box-shadow:inset -8px -8px 14px rgba(0,0,0,.15),inset 6px 6px 10px rgba(255,255,255,.35)}
  .balloon::after{content:"";position:absolute;left:50%;top:100%;width:1.5px;height:70px;background:rgba(255,255,255,.55)}
  .balloon::before{content:"";position:absolute;left:50%;top:97%;width:10px;height:8px;transform:translateX(-50%);background:inherit;clip-path:polygon(50% 0,0 100%,100% 100%)}
  @keyframes bup{0%{transform:translate(0,0) rotate(-4deg)}50%{transform:translate(24px,-60vh) rotate(5deg)}100%{transform:translate(-18px,-125vh) rotate(-4deg)}}
  .heart-r{position:fixed;bottom:-30px;z-index:1;pointer-events:none;animation:rise linear forwards}
  @keyframes rise{to{transform:translateY(-110vh) rotate(30deg);opacity:0}}
</style>
</head>
<body>

<div id="stars"></div>
<div id="balloons"></div>
<canvas id="fx"></canvas>
<div id="flash"></div>

<!-- 1: envelope -->
<section class="scene active" id="scene1">
  <div class="env-stage" id="envStage">
    <div class="env-glow"></div>
    <div class="env">
      <div class="env-back"></div>
      <div class="letter">for you</div>
      <div class="env-front"></div>
      <div class="env-flap"></div>
      <div class="seal">✦</div>
    </div>
  </div>
  <h1 class="gold-text">Unakkaga oru<br>chinna surprise</h1>
  <p class="sub">Indha naal romba special... thirandhu paaru</p>
  <button class="btn" id="openBtn">Click to Open ✨</button>
</section>

<!-- 2: story -->
<section class="scene" id="scene2">
  <p id="storyText"></p>
</section>

<!-- 3: cake -->
<section class="scene" id="scene3">
  <div class="bunting" id="bunting"></div>
  <h2 class="gold-text">Kann moodi oru wish pannu...</h2>
  <div class="cake-wrap" id="cakeWrap">
    <div class="halo"></div>
    <div class="wind">💨</div>
    <div class="candles">
      <div class="candle"><div class="flame"></div><div class="smoke"></div></div>
      <div class="candle"><div class="flame"></div><div class="smoke"></div></div>
      <div class="candle"><div class="flame"></div><div class="smoke"></div></div>
      <div class="candle"><div class="flame"></div><div class="smoke"></div></div>
      <div class="candle"><div class="flame"></div><div class="smoke"></div></div>
    </div>
    <div class="layer l3">
      <div class="drip"></div>
      <div class="berry" style="left:14%"></div><div class="berry" style="left:46%"></div><div class="berry" style="left:78%"></div>
    </div>
    <div class="layer l2">
      <div class="drip"></div>
      <div class="berry" style="left:10%"></div><div class="berry" style="left:34%"></div><div class="berry" style="left:58%"></div><div class="berry" style="left:84%"></div>
    </div>
    <div class="layer l1">
      <div class="drip"></div>
      <div class="name" id="cakeName"></div>
    </div>
    <div class="plate"></div>
  </div>
  <button class="btn" id="blowBtn">Blow 🌬️</button>
  <p class="hint">Wish pannitu, mella oodhu 🤍</p>
</section>

<!-- 4: hero -->
<section class="scene" id="scene4">
  <div class="hb" id="hb"></div>
  <div class="badge"><b class="gold-text" id="ageNum"></b></div>
  <div class="nm" id="nm"></div>
  <p class="tap">tap pannu... fireworks varum 🎆</p>
</section>

<!-- 5: letter -->
<section class="scene" id="scene5">
  <div class="paper">
    <h3 class="gold-text" id="letterTitle"></h3>
    <div id="letterBody"></div>
  </div>
</section>

<script>
/* ======== EDIT HERE ======== */
const NAME = 'Sakthi';
const AGE  = 22;
const LETTER = [
  "Inniki unnoda spl day Sakthi... intha day nee feel pannama nanga pathupom 🤍",
  "Nee ennakum bro kum keadacha spl gift. evlo sanda pottalum ennaikum unna vittu poga mattom.",
  "Indha " + AGE + " — un life oda azhagana oru pudhu chapter. Nee ninaikkara ellame, onnu onnu aa nijam aagum.",
  "Neraya sirichu, neraya jeichu, romba romba happy ah iru. Naan and lokesh bro eppavum un pakkathula irupom 💫",
  "Happy Birthday, Sakthi 🎂"
];
const STORY = [
  "Dhinamum ethanaiyo naal vandhu pogum...",
  "Aana sila naal mattum, manasula nikkum 🌙",
  "Indha naal... en thatha intha world ku vantha naal.",
  {big:true, t:NAME+" ✨"}
];
/* =========================== */

const $ = s => document.querySelector(s);
const scenes = ['#scene1','#scene2','#scene3','#scene4','#scene5'].map(s=>$(s));
const show = i => scenes.forEach((s,k)=>s.classList.toggle('active',k===i));
const rnd = (a,b)=>a+Math.random()*(b-a);
const sleep = ms => new Promise(r=>setTimeout(r,ms));

$('#cakeName').textContent = NAME;
$('#ageNum').textContent = AGE;
$('#letterTitle').textContent = 'Happy '+AGE+', '+NAME;

/* ---------- sky ---------- */
const sky=$('#stars');
for(let i=0;i<90;i++){
  const s=document.createElement('div'); s.className='star';
  const z=rnd(1,3); s.style.cssText=`left:${rnd(0,100)}vw;top:${rnd(0,100)}vh;width:${z}px;height:${z}px;animation-delay:${rnd(0,3)}s;animation-duration:${rnd(2,5)}s`;
  sky.appendChild(s);
}
setInterval(()=>{
  const s=document.createElement('div'); s.className='shoot';
  s.style.cssText=`left:${rnd(0,60)}vw;top:${rnd(0,40)}vh`;
  sky.appendChild(s); setTimeout(()=>s.remove(),1300);
},2800);

const stage=$('#envStage');
for(let i=0;i<9;i++){
  const sp=document.createElement('div'); sp.className='sparkle'; sp.textContent=['✦','✧','✨'][i%3];
  sp.style.cssText=`left:${rnd(-25,105)}%;top:${rnd(-30,110)}%;font-size:${rnd(12,26)}px;animation-delay:${rnd(0,2.4)}s`;
  stage.appendChild(sp);
}
const flagCols=['#ff5fa2','#ffd166','#a56bff','#4cc9f0','#80ed99','#ff9e00'];
for(let i=0;i<12;i++){
  const f=document.createElement('div'); f.className='flag';
  f.style.background=flagCols[i%flagCols.length]; f.style.animationDelay=(i*.15)+'s';
  $('#bunting').appendChild(f);
}

/* ---------- canvas fx ---------- */
const cv=$('#fx'), ctx=cv.getContext('2d');
const fit=()=>{cv.width=innerWidth;cv.height=innerHeight}; fit(); addEventListener('resize',fit);
let conf=[], sparks=[], rockets=[], fireworksOn=false, fallingOn=false;

function burst(n,x,y){
  const cols=['#ff5fa2','#ffd166','#a56bff','#4cc9f0','#80ed99','#ff9e00','#fff'];
  for(let i=0;i<n;i++){
    const a=rnd(0,Math.PI*2), sp=rnd(4,11);
    conf.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-5,w:rnd(6,12),h:rnd(8,16),r:rnd(0,6),vr:rnd(-.3,.3),
      c:cols[Math.floor(rnd(0,cols.length))],life:rnd(150,240)});
  }
}
function fall(){
  const cols=['#ff5fa2','#ffd166','#a56bff','#4cc9f0','#80ed99'];
  conf.push({x:rnd(0,innerWidth),y:-20,vx:rnd(-1,1),vy:rnd(2,4),w:rnd(6,10),h:rnd(8,13),r:rnd(0,6),vr:rnd(-.2,.2),
    c:cols[Math.floor(rnd(0,cols.length))],life:400,slow:true});
}
function launch(x){
  rockets.push({x:x??rnd(innerWidth*.12,innerWidth*.88),y:innerHeight+10,vx:rnd(-1,1),vy:-rnd(11,15),
    ty:rnd(innerHeight*.12,innerHeight*.42),hue:rnd(0,360)});
}
function explode(x,y,hue){
  const n=100;
  for(let i=0;i<n;i++){
    const a=(i/n)*Math.PI*2, sp=rnd(1.5,6.5);
    sparks.push({x,y,px:x,py:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:rnd(55,95),max:95,hue:hue+rnd(-25,25)});
  }
}
function frame(){
  ctx.clearRect(0,0,cv.width,cv.height);
  conf.forEach(p=>{
    p.vy+=p.slow?.02:.2; p.x+=p.vx; p.y+=p.vy; p.vx*=.99; p.r+=p.vr; p.life--;
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r);
    ctx.globalAlpha=Math.max(0,Math.min(1,p.life/40)); ctx.fillStyle=p.c;
    ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore();
  });
  conf=conf.filter(p=>p.life>0&&p.y<cv.height+40);
  ctx.globalCompositeOperation='lighter';
  rockets.forEach(r=>{
    r.x+=r.vx; r.y+=r.vy; r.vy+=.12;
    ctx.strokeStyle=`hsl(${r.hue},100%,70%)`; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(r.x,r.y); ctx.lineTo(r.x-r.vx*3,r.y-r.vy*3); ctx.stroke();
    if(r.y<=r.ty||r.vy>=0){r.dead=true; explode(r.x,r.y,r.hue)}
  });
  rockets=rockets.filter(r=>!r.dead);
  sparks.forEach(s=>{
    s.px=s.x; s.py=s.y; s.vy+=.05; s.vx*=.985; s.vy*=.985; s.x+=s.vx; s.y+=s.vy; s.life--;
    ctx.strokeStyle=`hsla(${s.hue},100%,65%,${Math.max(0,s.life/s.max)})`; ctx.lineWidth=2.2;
    ctx.beginPath(); ctx.moveTo(s.px,s.py); ctx.lineTo(s.x,s.y); ctx.stroke();
  });
  sparks=sparks.filter(s=>s.life>0);
  ctx.globalCompositeOperation='source-over';
  requestAnimationFrame(frame);
}
frame();
setInterval(()=>{ if(fireworksOn) launch(); },800);
setInterval(()=>{ if(fallingOn) fall(); },90);
document.addEventListener('pointerdown',e=>{
  if(fireworksOn){ launch(e.clientX); burst(30,e.clientX,e.clientY); }
});

/* ---------- balloons / hearts ---------- */
function balloons(){
  const cols=['#ff5fa2','#ffd166','#a56bff','#4cc9f0','#80ed99','#ff7b54'];
  const box=$('#balloons');
  for(let i=0;i<16;i++){
    const b=document.createElement('div'); b.className='balloon';
    b.style.cssText=`left:${rnd(0,94)}vw;background:${cols[i%cols.length]};animation-duration:${rnd(7,12)}s;animation-delay:${rnd(0,3.5)}s`;
    box.appendChild(b); setTimeout(()=>b.remove(),17000);
  }
}
function floatHearts(){
  setInterval(()=>{
    const h=document.createElement('div'); h.className='heart-r';
    h.textContent=['💗','💖','💕','✨'][Math.floor(rnd(0,4))];
    h.style.cssText+=`left:${rnd(0,100)}vw;font-size:${rnd(16,34)}px;animation-duration:${rnd(6,10)}s`;
    document.body.appendChild(h); setTimeout(()=>h.remove(),10500);
  },450);
}

/* ---------- text helpers ---------- */
function letters(el,text,delay){
  el.innerHTML='';
  Array.from(text).forEach((ch,i)=>{
    const s=document.createElement('span');
    s.textContent=ch===' '?'\u00A0':ch;
    if(ch.codePointAt(0)>0x2000) s.className='emo';
    s.style.animationDelay=(delay+i*.07)+'s';
    el.appendChild(s);
  });
}
async function typeLetter(){
  const body=$('#letterBody');
  for(const line of LETTER){
    const p=document.createElement('p'); body.appendChild(p);
    const caret=document.createElement('span'); caret.className='caret'; p.appendChild(caret);
    for(const ch of Array.from(line)){
      caret.before(ch);
      await sleep(ch==='.'||ch===','?170:42);
    }
    caret.remove();
    await sleep(550);
  }
  fireworksOn=true;
  setTimeout(()=>burst(200,innerWidth/2,innerHeight/2),600);
}

/* ---------- story ---------- */
async function runStory(){
  show(1);
  const el=$('#storyText');
  for(const item of STORY){
    const big=typeof item==='object';
    el.className=big?'big':'';
    el.textContent=big?item.t:item;
    await sleep(60); el.classList.add('in');
    await sleep(big?2600:3000);
    if(!big){ el.classList.remove('in'); await sleep(900); }
  }
  el.classList.remove('in');
  await sleep(900);
  show(2);
}

/* ---------- flow ---------- */
$('#openBtn').onclick=()=>{
  $('#openBtn').disabled=true;
  $('#scene1').classList.add('opening');
  setTimeout(()=>{ $('#flash').classList.add('go'); burst(90,innerWidth/2,innerHeight/2.2); },1000);
  setTimeout(runStory,1500);
};

$('#blowBtn').onclick=()=>{
  const wrap=$('#cakeWrap'); $('#blowBtn').disabled=true;
  wrap.classList.add('blowing');
  const candles=[...document.querySelectorAll('.candle')];
  setTimeout(()=>{
    wrap.classList.remove('blowing');
    candles.forEach((c,i)=>setTimeout(()=>c.classList.add('out'),i*140));
    wrap.classList.add('out-all');
    document.body.classList.add('lights-off');
  },900);
  setTimeout(()=>{
    document.body.classList.remove('lights-off'); document.body.classList.add('party');
    $('#flash').classList.add('go');
    show(3);
    letters($('#hb'),'Happy Birthday',.3);
    letters($('#nm'),NAME+' 💗',1.6);
    burst(240,innerWidth/2,innerHeight/3);
    setTimeout(()=>burst(160,innerWidth*.2,innerHeight/2),500);
    setTimeout(()=>burst(160,innerWidth*.8,innerHeight/2),900);
    balloons(); setInterval(balloons,9000);
    fireworksOn=true; fallingOn=true; floatHearts();
    // after the celebration, the heartfelt letter
    setTimeout(()=>{ show(4); typeLetter(); },8500);
  },3300);
};
</script>
